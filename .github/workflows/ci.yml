name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore TransitPulse.slnx

      - run: dotnet build TransitPulse.slnx -c Release --no-restore

      # Replay.Tests has SIGSEGV'd (exit 139, "Zero tests ran") when its Testcontainers
      # host starts in parallel with Integration.Tests; run it alone after the rest.
      - name: Test (except Replay)
        run: |
          set -euo pipefail
          mapfile -t projects < <(dotnet sln TransitPulse.slnx list | grep '\.Tests\.csproj$' | grep -v 'Replay\.Tests')
          printf '%s\n' "${projects[@]}" | xargs -n1 -P8 -I{} dotnet test {} -c Release --no-build

      - name: Test Replay (isolated)
        run: dotnet test tests/TransitPulse.Replay.Tests -c Release --no-build

      - run: dotnet format TransitPulse.slnx --verify-no-changes --no-restore

  # The collector ships as a Native AOT binary; build and test do not run trim analysis or the native code.
  aot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet publish src/TransitPulse.Ingestor -r linux-x64 -c Release -o publish

      - run: ./publish/TransitPulse.Ingestor --self-test
