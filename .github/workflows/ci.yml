name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore TransitPulse.slnx

      - run: dotnet build TransitPulse.slnx -c Release --no-restore

      - run: dotnet test --solution TransitPulse.slnx -c Release --no-build

      - run: dotnet format TransitPulse.slnx --verify-no-changes --no-restore
