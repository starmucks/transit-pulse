name: Task
description: A planned unit of work that can be merged as one pull request.
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this task delivers and which project goal it moves forward.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable conditions; the task is done when all are met.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Risks, open questions, links to ADRs.
